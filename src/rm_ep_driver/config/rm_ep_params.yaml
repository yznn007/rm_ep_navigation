# RoboMaster EP 驱动参数配置

# EP 连接参数
ep_sn: "3JKDH3B001891M"     # EP 序列号 (SN)，路由器模式下用于发现设备
ep_conn_type: "ap"        # 连接类型: "sta"(路由器模式) / "ap"(直连模式)
ep_ip: ""                  # EP IP地址 (留空则通过SN自动发现)

# 发布频率 (Hz)
odom_rate: 20              # 里程计发布频率
imu_rate: 20               # IMU数据发布频率

# TF参数
odom_frame_id: "odom"
base_frame_id: "base_link"
imu_frame_id: "imu_link"

# 控制参数
cmd_vel_timeout: 0.5       # 速度指令超时时间 (秒)，超时后自动停止
enable_cmd_vel: true       # 是否启用 /cmd_vel 控制

# 相机流（可选）
enable_camera: true               # 是否启用相机流，发布 /camera/image_raw
camera_frame_id: "camera_link_optical_frame"   # 相机图像 frame_id

# 云台关节（可选）
enable_gimbal: true               # 是否发布云台关节状态 /joint_states
gimbal_rate: 50                   # 云台数据订阅频率 (Hz)

# 初始姿态校准
init_attitude_calibration: true   # 用初始姿态校准里程计（输出相对位姿）

# IMU 加速度补偿
imu_gravity_constant: 9.86        # 重力常数，>0 则加速度乘以该值（9.86 转为 m/s²）
